version: "3"
services:
    happlearning-backend-staging:
        container_name: magalu-backend-staging
        build: .
        image: happlearning.azurecr.io/magalu-backend-staging
        restart: always
        ports:
            - "3000:3000"
    happlearning-backend-prod:
        container_name: magalu-backend-prod
        build: .
        image: happlearning.azurecr.io/magalu-backend-prod
        restart: always
        ports:
            - "3000:3000"