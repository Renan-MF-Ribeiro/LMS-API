# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main
- staging


resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '84aab9b3-fcd3-410b-b505-931bb62751c0'
  imageRepositoryProd: 'cacaushow-backend-prod'
  imageRepositoryStaging: 'cacaushow-backend-staging'
  containerRegistry: 'happlearning.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: 'latest'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: DownloadSecureFile@1
      displayName: 'Download secure file'
      name: dotenvprod
      inputs:
        secureFile: 'cacaushow.env.prod'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    - task: DownloadSecureFile@1
      displayName: 'Download secure file'
      name: dotenvstaging
      inputs:
        secureFile: 'cacaushow.env.staging'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/staging'))
    - task: CmdLine@2
      inputs:
        script: 'mv $(dotenvprod.secureFilePath) $(System.DefaultWorkingDirectory)/.env'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    - task: CmdLine@2
      inputs:
        script: 'mv $(dotenvstaging.secureFilePath) $(System.DefaultWorkingDirectory)/.env'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/staging'))

    - task: CmdLine@2
      inputs:
        script: 'ls -a $(System.DefaultWorkingDirectory)'
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepositoryProd)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepositoryStaging)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/staging'))
- stage: Deploy
  displayName: Deploy to container instance
  jobs:  
  - job: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      displayName: 'Restart containers'
      inputs:
        azureSubscription: 'Pago conforme o uso (8181574c-f09a-4b26-8008-9d0119427b12)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: az container restart -n lmsCacauShowStaging -g LMS_CacauShow
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/staging'))
    - task: AzureCLI@2
      displayName: 'Restart containers'
      inputs:
        azureSubscription: 'Pago conforme o uso (8181574c-f09a-4b26-8008-9d0119427b12)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: az container restart -n lmsCacauShowProd -g LMS_CacauShow
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
